<body class="body" id="SpectrumStep">
	<header class="site-header">
		<div class="header-left">
			<a class="header-link" href="https://ardoid.eu/" data-tooltip="Return to ardoid.eu main page">ardoid.eu</a>
		</div>
		<nav class="header-nav" aria-label="Site navigation">
			<a class="header-link active" href="./" aria-current="page" data-tooltip="SpectrumStep – Color Mixer application">SpectrumStep</a>
			<a class="header-link" href="docu/" data-tooltip="Open technical documentation and usage guide">Documentation</a>
			<a class="header-link" href="https://ardoid.eu/legal-notice/">Legal Notice</a>
			<a class="header-link" href="https://ardoid.eu/contact/">Contact</a>
		</nav>
		<div class="header-right" id="theme-select"></div>
	</header>
	<main>
		<div class="middle" id="middle">
			<div class="color-container">
				<fieldset class="color-selection">
					<legend>Color 1</legend>
					<div>
						<div id="form-cmx-0"></div>
						<div class="button-container">
							<button onclick="calcform_cmx_col_shuffle(0)" data-tooltip="Generate a uniform random 24-bit sRGB color (R, G, B ∈ [0, 255])"><img class="icon" src="assets/icons/shuffle-solid-full.svg"/>Random</button>
							<button onclick="calcform_cmx_col_invert(0,false)" data-tooltip="sRGB complement: invert all RGB channels (255 − R, 255 − G, 255 − B), shifting hue by 180° and inverting lightness"><img class="icon" src="assets/icons/circle-half-stroke-solid-full.svg"/>RGB-Invert</button>
							<button onclick="calcform_cmx_col_invert(0,true)" data-tooltip="HSL lightness inversion: reflect Lightness (L' = 100% − L) while preserving Hue and Saturation for dark/light theme adaptation"><img class="icon" src="assets/icons/circle-half-stroke-solid-full.svg"/>HSL-Invert</button>
							<button onclick="calcform_cmx_use_col(0)" data-tooltip="Copy Color 1 hex value (#RRGGBB) to Color 2"><img class="icon" src="assets/icons/right-long-solid-full.svg"/>Copy</button>
						</div>
					</div>
				</fieldset>
				<fieldset class="color-selection">
					<legend>Color 2</legend>
					<div>
						<div id="form-cmx-1"></div>
						<div class="button-container">
							<button onclick="calcform_cmx_col_shuffle(1)" data-tooltip="Generate a uniform random 24-bit sRGB color (R, G, B ∈ [0, 255])"><img class="icon" src="assets/icons/shuffle-solid-full.svg"/>Random</button>
							<button onclick="calcform_cmx_col_invert(1,false)" data-tooltip="sRGB complement: invert all RGB channels (255 − R, 255 − G, 255 − B), shifting hue by 180° and inverting lightness"><img class="icon" src="assets/icons/circle-half-stroke-solid-full.svg"/>RGB-Invert</button>
							<button onclick="calcform_cmx_col_invert(1,true)" data-tooltip="HSL lightness inversion: reflect Lightness (L' = 100% − L) while preserving Hue and Saturation for dark/light theme adaptation"><img class="icon" src="assets/icons/circle-half-stroke-solid-full.svg"/>HSL-Invert</button>
							<button onclick="calcform_cmx_use_col(1)" data-tooltip="Copy Color 2 hex value (#RRGGBB) to Color 1"><img class="icon" src="assets/icons/left-long-solid-full.svg"/>Copy</button>
						</div>
					</div>
				</fieldset>
			</div>
			<fieldset class="settings-container">
				<legend>Steps</legend>
				<div class="range-setting">
					<label for="steps">Steps</label>
					<input type="range" id="steps" name="steps" min="2" max="16" value="7">
					<output for="steps" id="steps-value">7</output>
				</div>
				<div class="range-setting">
					<label for="overdrive">Overdrive</label>
					<input type="range" id="overdrive" name="overdrive" min="0" max="16" value="0">
					<output for="overdrive" id="overdrive-value">0</output>
				</div>
			</fieldset>
			<div class="settings-container">
				<fieldset class="flex" id="gradientMode">
					<legend>Gradient</legend>
					<div id="gradient-select"></div>
					<div id="gradientDirection"></div>
					<div id="gradientWay"></div>
					<div id="contrastVisibility"></div>
				</fieldset>
				<fieldset class="flex-scatter-childs" id="textContrast">
					<legend>Text color</legend>
					<button id="textContrast-black" class="btn-select" data-color="#000000">Black</button>
					<button id="textContrast-white" class="btn-select" data-color="#ffffff">White</button>
					<label id="textContrast-label" class="btn-select">
						<span  id="textContrast-color-preview">Color</span>
						<input type="color" value="#888888" id="textContrast-color">
					</label>
				</fieldset>
				<fieldset class="flex-scatter-childs" id="backContrast">
					<legend>Background color</legend>
					<button id="backContrast-black" class="btn-select" data-color="#000000"><span>Black</span></button>
					<button id="backContrast-white" class="btn-select" data-color="#ffffff"><span>White</span></button>
					<label id="backContrast-label" class="btn-select">
						<span  id="backContrast-color-preview">Color</span>
						<input type="color" value="#888888" id="backContrast-color">
					</label>
				</fieldset>
			</div>
			<div id="tab-cmx"></div>
			<div id="grd-cmx" class="linear-gradient"></div>
			<details>
				<summary data-tooltip="Expand local browser storage to load or save named palette configurations">User Store to load and save palettes</summary>
				<fieldset>
					<legend>Store</legend>
					<div class="flex">
						<div class="flex">
							<select id="load-input" class="narrow"></select>
							<button id="load-btn" type="button"><img src="assets/icons/folder-open-solid-full.svg" alt="icon for load" class="icon" />Load</button>
						</div>
						<div class="flex">
							<input id="save-input" class="narrow" />
							<button id="save-btn" type="button"><img src="assets/icons/floppy-disk-solid-full.svg" alt="icon for save" class="icon" />Save</button>
						</div>
					</div>
				</fieldset>
			</details>
		</div>
	</main>
</body>

</html>
